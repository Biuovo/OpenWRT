name: Release R4S Flow
run-name: R4SFlow - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: r76s
        options:
          - r76s
          - x64

permissions: write-all

env:
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev rsync
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq clean

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Grant execute permission
        run: find . -name "*.sh" -exec chmod +x {} \;

      - name: Cache downloads and build state
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            action_build/dl
            action_build/staging_dir
          key: r4sflow-${{ runner.os }}-${{ inputs.model }}-${{ hashFiles('r4sflow/**', 'wrt_core/patches/install_refind_sing_box.sh') }}
          restore-keys: |
            r4sflow-${{ runner.os }}-${{ inputs.model }}-

      - name: Refresh restored cache stamps
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Build Firmware
        run: ./r4sflow/build.sh ${{ inputs.model }}

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r4sflow-${{ inputs.model }}-failure-logs
          path: |
            action_build/logs/**
            action_build/.config
            action_build/tmp/.config-package.in
          if-no-files-found: ignore


      - name: Publish matching opkg feed
        if: success()
        run: |
          if [ -d "package_repo/r4sflow/${{ inputs.model }}/latest" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            rm -rf /tmp/r4sflow-pages
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/r4sflow-pages
            else
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/r4sflow-pages
              cd /tmp/r4sflow-pages
              git checkout --orphan gh-pages
              git rm -rf . >/dev/null 2>&1 || true
              cd "$GITHUB_WORKSPACE"
            fi
            mkdir -p "/tmp/r4sflow-pages/r4sflow/${{ inputs.model }}"
            rm -rf "/tmp/r4sflow-pages/r4sflow/${{ inputs.model }}/latest"
            cp -a "package_repo/r4sflow/${{ inputs.model }}/latest" "/tmp/r4sflow-pages/r4sflow/${{ inputs.model }}/"
            cd /tmp/r4sflow-pages
            git add -A
            git commit -m "Update r4sflow ${{ inputs.model }} opkg feed" || exit 0
            git push origin gh-pages
          fi

      - name: Kernel Version
        if: success()
        run: |
          echo "KVER=$(grep -h -oP '^kernel.*' ./firmware/*.manifest | grep -oP '[4-6]\.[0-9]{1,3}\.[0-9]{1,3}' | head -n1)" >> $GITHUB_ENV

      - name: Prepare Release Body
        if: success()
        run: |
          PLUGINS=$(grep -h -oP 'luci-app(-[a-zA-Z0-9]{1,}){1,}' ./firmware/*.manifest 2>/dev/null | sort -u | paste - - - | awk '{printf "%-28s %-28s %-28s\n",$1,$2,$3}')
          {
            echo "**R4SFlow OpenWrt Firmware for ${{ inputs.model }}**"
            echo "- Kernel: ${{ env.KVER }}"
            echo "- LAN IP: 192.168.100.1"
            echo ""
            echo "Plugins:"
            echo '```'
            echo "$PLUGINS"
            echo '```'
          } > release_body.txt

      - name: Release Firmware
        if: success()
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: r4sflow_${{ inputs.model }}_${{ github.run_number }}
          files: ./firmware/*.*
          body_path: ./release_body.txt
