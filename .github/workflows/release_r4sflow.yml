name: Release R4S Flow
run-name: R4SFlow - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: r76s
        options:
          - r76s
          - x64

permissions: write-all

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq clean

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Grant execute permission
        run: find . -name "*.sh" -exec chmod +x {} \;

      - name: Build Firmware
        run: ./r4sflow/build.sh ${{ inputs.model }}

      - name: Kernel Version
        if: success()
        run: |
          echo "KVER=$(grep -h -oP '^kernel.*' ./firmware/*.manifest | grep -oP '[4-6]\.[0-9]{1,3}\.[0-9]{1,3}' | head -n1)" >> $GITHUB_ENV

      - name: Prepare Release Body
        if: success()
        run: |
          PLUGINS=$(grep -h -oP 'luci-app(-[a-zA-Z0-9]{1,}){1,}' ./firmware/*.manifest 2>/dev/null | sort -u | paste - - - | awk '{printf "%-28s %-28s %-28s\n",$1,$2,$3}')
          cat > release_body.txt <<EOF_BODY
          **R4SFlow OpenWrt Firmware for ${{ inputs.model }}**
          - Kernel: ${{ env.KVER }}
          - LAN IP: 192.168.100.1

          Plugins:
          \`\`\`
          $PLUGINS
          \`\`\`
EOF_BODY

      - name: Release Firmware
        if: success()
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: r4sflow_${{ inputs.model }}_${{ github.run_number }}
          files: ./firmware/*.*
          body_path: ./release_body.txt
